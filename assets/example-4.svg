<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="768" height="480" role="img" aria-labelledby="t d">
  <title id="t">geonum example 4: one angle, every shadow</title>
  <desc id="d">a geonum v = [2, π/6] and three dimensions made by quarter turns, x at 0, y at π/2, z at π. the shadow on the x line reads m cos θ along x and −m cos θ along z, the same segment, because the third dimension is a half turn from the first: each dimension is orthogonal to the one before it, not to all of them</desc>
  <style>
    text { font-family: ui-monospace, Menlo, Consolas, monospace; }
    .ink  { fill: #6e7781; }
    .lbl  { fill: #8b949e; }
    .ray  { stroke: #8b949e; fill: none; }
    .blue { stroke: #2f81f7; }
    .bluef{ fill: #2f81f7; }
    .or   { stroke: #e16f24; fill: none; }
    .orf  { fill: #e16f24; }
  </style>
  <defs>
    <marker id="tip" viewBox="0 0 10 10" refX="10" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" class="bluef"/>
    </marker>
  </defs>

  <!-- three rays: x (0), y (π/2), z (π) -->
  <line x1="200" y1="230" x2="420" y2="230" class="ray" stroke-width="1.2"/>
  <line x1="200" y1="230" x2="200" y2="60"  class="ray" stroke-width="1.2"/>
  <line x1="200" y1="230" x2="80"  y2="230" class="ray" stroke-width="1.2"/>

  <!-- +π/2 from x to y, +π/2 from y to z -->
  <path d="M234,230 A34,34 0 0 0 202.4,196.1" class="ray" stroke-width="1"/>
  <path d="M197.6,196.1 A34,34 0 0 0 166,230" class="ray" stroke-width="1"/>
  <text x="226" y="185" font-size="11" class="lbl" text-anchor="middle">+π/2</text>
  <text x="163" y="193" font-size="11" class="lbl" text-anchor="middle">+π/2</text>

  <!-- drops from the tip of v to the x line and the y line, right-angle marks at the feet -->
  <g class="ray" stroke-width="1" stroke-dasharray="2 3">
    <line x1="355.9" y1="140" x2="355.9" y2="230"/>
    <line x1="355.9" y1="140" x2="200"   y2="140"/>
  </g>
  <g class="ray" stroke-width="1">
    <path d="M347.9,230 L347.9,222 L355.9,222"/>
    <path d="M200,148 L208,148 L208,140"/>
  </g>

  <!-- two shadows -->
  <line x1="200" y1="230" x2="355.9" y2="230" class="or" stroke-width="5"/>
  <line x1="200" y1="230" x2="200"   y2="140" class="or" stroke-width="5"/>

  <!-- v = [2, π/6] -->
  <line x1="200" y1="230" x2="355.9" y2="140" class="blue" stroke-width="3" marker-end="url(#tip)"/>
  <circle cx="200" cy="230" r="3.5" class="ink"/>
  <text x="364" y="136" font-size="12" class="bluef">v = [2, π/6]</text>

  <!-- shadow readings: one segment on the x line, two readings -->
  <g font-size="12" class="orf" text-anchor="middle">
    <text x="278" y="252">x =  m cos θ</text>
    <text x="278" y="268">z = −m cos θ</text>
  </g>
  <text x="190" y="162" font-size="12" class="orf" text-anchor="end">y = m sin θ</text>

  <!-- ray-end labels: letter, ordinal -->
  <g font-size="12" class="lbl">
    <text x="430" y="226">x</text><text x="430" y="241">1st</text>
    <text x="200" y="40" text-anchor="middle">y</text><text x="200" y="55" text-anchor="middle">2nd</text>
    <text x="70" y="226" text-anchor="end">z</text><text x="70" y="241" text-anchor="end">3rd</text>
  </g>

  <!-- caption -->
  <g font-size="11" class="lbl">
    <text x="80" y="324">one angle, every shadow</text>
    <text x="80" y="342">each +π/2 is the next dimension</text>
    <text x="80" y="360">orthogonality is ordered, each dimension to the one before it</text>
  </g>
</svg>
